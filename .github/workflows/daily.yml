name: Daily Rotation
on:
  schedule:
    # GitHub 예약은 자주 밀리므로, 발송 시각(11:00 KST)보다 훨씬 이른 시각에
    # 두 번 깨워둔다. 실제 발송은 슬랙 예약 기능이 정확히 처리한다.
    - cron: '0 18 * * 0-4'   # UTC 18:00 = 한국시간 03:00 (월~금)
    - cron: '0 23 * * 0-4'   # UTC 23:00 = 한국시간 08:00 (월~금) — 예비
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: pip install slack_sdk
      - run: python send_daily.py
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          # 둘 중 어느 예약이 깨웠는지 알려준다 (수동 실행 시에는 빈 값)
          SCHEDULE_CRON: ${{ github.event.schedule }}
